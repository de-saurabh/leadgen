services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: leadgen
      POSTGRES_DB: leadgen
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leadgen -d leadgen']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
